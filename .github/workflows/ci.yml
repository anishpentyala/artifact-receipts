name: ci
on: [push, pull_request]
jobs:
  installed:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10']
        pytest: ['8.3.5', '9.2.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build "pytest==${{ matrix.pytest }}"
      - run: python -m build
      - run: python -m pip install --no-deps dist/*.whl
      - run: cd /tmp && python "$GITHUB_WORKSPACE/ci/qualify_installed.py" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/dist/artifact_receipts-0.1.0-py3-none-any.whl"
