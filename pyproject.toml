[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "artifact-receipts"
version = "0.1.0"
description = "Bind pytest-observed import origins to the bytes of a specific local wheel"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8",
]

[project.scripts]
artifact-receipts = "artifact_receipts.cli:main"

[tool.setuptools]
packages = ["artifact_receipts"]
